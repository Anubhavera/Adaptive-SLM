# Build for the host target by default (Linux dev box).
# For Windows MSYS2 UCRT64 builds, pass `--target x86_64-pc-windows-gnu`
# explicitly; the linker config below only applies to that target.

[target.x86_64-pc-windows-gnu]
linker = "C:\\msys64\\ucrt64\\bin\\gcc.exe"
ar = "C:\\msys64\\ucrt64\\bin\\ar.exe"

[env]
# The C++ core lives at core/build: libadaptive_slm.so must be findable at
# runtime by test binaries and binaries built from this crate.
LD_LIBRARY_PATH = "/home/anubhav/Anubhav/Adaptive-SLM/core/build"
